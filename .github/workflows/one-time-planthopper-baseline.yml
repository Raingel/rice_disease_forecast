name: One-time Planthopper Baseline Bootstrap

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to commit baseline files to'
        required: true
        default: 'main'
      run_daily_pipeline_first:
        description: 'Run full daily pipeline before baseline build (true/false)'
        required: true
        default: 'false'

permissions:
  contents: write

jobs:
  bootstrap-planthopper-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-github-actions.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-github-actions.txt

      - name: (Optional) Refresh latest forecast outputs first
        if: ${{ inputs.run_daily_pipeline_first == 'true' }}
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
          DATA_FOLDER: ${{ github.workspace }}/rice_blast_prediction/data
          RECENT_OUTPUT_FOLDER: ${{ github.workspace }}/rice_blast_prediction/recent_daily_by_station
          OUTPUT_CSV: ${{ github.workspace }}/rice_blast_prediction/recent_summary.csv
          PLAN_FOLDER: ""
          ERA5_OUTPUT_DIR: ${{ github.workspace }}/ERA5
          PLAN_AVG_SNAPSHOT_CSV: ${{ github.workspace }}/_tmp_skip_plan_snapshot.csv
        run: bash scripts/run_daily_pipeline.sh

      - name: Build fresh planthopper average first (no snapshot override)
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
          DATA_FOLDER: ${{ github.workspace }}/rice_blast_prediction/data
          OUTPUT_CSV: ${{ github.workspace }}/rice_blast_prediction/recent_summary.csv
          PLAN_FOLDER: ""
          PLAN_AVG_SNAPSHOT_CSV: ${{ github.workspace }}/_tmp_skip_plan_snapshot.csv
        run: python models/crop_season_avg.py

      - name: Materialize reusable snapshot from recent_summary
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
          INPUT_SUMMARY_CSV: ${{ github.workspace }}/rice_blast_prediction/recent_summary.csv
          PLAN_AVG_SNAPSHOT_CSV: ${{ github.workspace }}/rice_blast_prediction/planthopper_avg_snapshot.csv
        run: python models/build_planthopper_avg_snapshot.py

      - name: Re-generate recent_summary using snapshot override (steady state)
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
          DATA_FOLDER: ${{ github.workspace }}/rice_blast_prediction/data
          OUTPUT_CSV: ${{ github.workspace }}/rice_blast_prediction/recent_summary.csv
          PLAN_FOLDER: ""
          PLAN_AVG_SNAPSHOT_CSV: ${{ github.workspace }}/rice_blast_prediction/planthopper_avg_snapshot.csv
        run: python models/crop_season_avg.py

      - name: Verify snapshot is non-empty
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'rice_blast_prediction/planthopper_avg_snapshot.csv'
          df = pd.read_csv(p)
          if df.empty:
              raise SystemExit('Snapshot file is empty')
          print(f'Snapshot rows: {len(df)}')
          PY

      - name: Commit and push baseline artifacts
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rice_blast_prediction/planthopper_avg_snapshot.csv rice_blast_prediction/recent_summary.csv
            git commit -m "chore: bootstrap planthopper baseline snapshot"
            git push
          else
            echo "No changes to commit."
          fi
