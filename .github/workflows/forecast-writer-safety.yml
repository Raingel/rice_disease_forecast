name: Forecast main writer serialization safety

on:
  pull_request:
    paths:
      - '.github/workflows/daily-forecast.yml'
      - '.github/workflows/blastam-forecast.yml'
      - '.github/workflows/forecast-writer-safety.yml'
      - 'scripts/prepare_forecast_main_checkout.sh'
      - 'tests/test_forecast_writer_serialization.py'
      - 'docs/daily_forecast_main_writer_serialization.md'

permissions:
  contents: read

jobs:
  main-writer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            scripts
            tests
            models
            registry
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install isolated regression dependencies
        run: python -m pip install PyYAML==6.0.2 numpy==1.26.4 pandas==2.2.2 requests==2.32.3
      - name: Simulate queued stale checkout, group locking and safe publish
        run: python -m unittest discover -s tests -p 'test_forecast_writer_serialization.py' -v
      - name: Preserve public station and season summary v1
        run: python -m unittest discover -s tests -p 'test_public_contract_v1.py' -v
      - name: Preserve model registry and Phase 4B catalog shadow
        run: |
          python -m unittest discover -s tests -p 'test_model_registry.py' -v
          python -m unittest discover -s tests -p 'test_phase4b_registry_shadow.py' -v
      - name: Preserve EPIRICE and location regressions
        run: |
          python -m unittest discover -s tests -p 'test_epirice_*.py'
          python -m unittest discover -s tests -p 'test_recent_station_coordinates.py'
