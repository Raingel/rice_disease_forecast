name: Public forecast CSV v1 compatibility

on:
  pull_request:
    paths:
      - 'models/recent_forecast_organizer.py'
      - 'models/crop_season_avg.py'
      - 'models/EPIRICE_BLB/**'
      - 'models/EPIRICE_LB/**'
      - 'models/epirice/**'
      - 'tests/test_public_contract_v1.py'
      - 'tests/fixtures/public_contract_v1/**'
      - 'docs/public_forecast_contract_v1.md'
      - '.github/workflows/public-contract-v1.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            models
            tests
            scripts
            docs
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3
      - name: Freeze website-facing public outputs
        run: python -m unittest discover -s tests -p 'test_public_contract_v1.py' -v
      - name: Existing EPIRICE and station regression
        run: |
          python -m unittest discover -s tests -p 'test_epirice_*.py'
          python -m unittest discover -s tests -p 'test_recent_station_coordinates.py'
