name: EPIRICE LB isolated R parity trial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leaf-blast-trial:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      TRIAL_OUTPUT: ${{ runner.temp }}/epirice-lb-trial
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /models/EPIRICE_BLB/
            /models/recent_forecast_organizer.py
            /scripts/rebuild_epirice_history.py
            /scripts/integrate_epirice_history_year.py
            /scripts/migrate_epirice_outputs.py
            /scripts/run_daily_pipeline.sh
            /.github/workflows/daily-forecast.yml
            /tests/test_epirice*.py
            /tests/epirice_lb_trial/
            /tests/fixtures/epirice_blb/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned Python dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3
      - name: Run existing EPIRICE regressions and bounded LB tests
        run: python -m unittest discover -s tests -p 'test_epirice*.py' -v
      - name: Prepare three synthetic cases and one station with two crop seasons
        run: python tests/epirice_lb_trial/run_trial.py prepare --output "$TRIAL_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Install pinned R data.table dependency
        shell: Rscript {0}
        run: |
          install.packages("https://cran.r-project.org/src/contrib/Archive/data.table/data.table_1.16.4.tar.gz", repos = NULL, type = "source", Ncpus = 2)
          stopifnot(as.character(packageVersion("data.table")) == "1.16.4")
      - name: Fetch exact upstream R files and verify SHA-256
        run: python tests/epirice_lb_trial/run_trial.py fetch-source --output "$TRIAL_OUTPUT"
      - name: Execute original R helper with read-only intermediate tracing
        run: Rscript tests/epirice_lb_trial/reference.R "$TRIAL_OUTPUT"
      - name: Compare all 120 days with absolute tolerance 1e-6
        run: python tests/epirice_lb_trial/run_trial.py compare --output "$TRIAL_OUTPUT"
      - name: Retain results and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epirice-lb-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/epirice-lb-trial/
          if-no-files-found: warn
          retention-days: 30
