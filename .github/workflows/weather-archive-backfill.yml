name: Resumable weather archive from 2013

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Small batch (two stations, annual requests, estimated quota capped)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: weather-archive-2013-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/maintain_weather_archive.py
            /scripts/weather_archive_action.py
            /scripts/weather_archive_batch.py
            /tests/test_weather_archive*.py
            /weather_backfill/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install bounded worker dependencies
        run: pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3
      - name: Verify checkpoint, data validation and stop behavior
        run: python -m unittest discover -s tests -p 'test_weather_archive*.py'
      - name: Resume weather only; save checkpoints on the data branch
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE: ${{ inputs.smoke && 'true' || 'false' }}
        run: |
          if [[ "$SMOKE" == "true" ]]; then
            python -u scripts/weather_archive_action.py --inventory weather_backfill/inputs --cache "$RUNNER_TEMP/weather-cache" --max-seconds 600 --max-stations 2 --batch-size 2 --max-requests 2 --max-weighted-calls 120 --daily-weighted-calls 8000
          else
            python -u scripts/weather_archive_action.py --inventory weather_backfill/inputs --cache "$RUNNER_TEMP/weather-cache" --max-seconds 2100 --max-stations 50 --batch-size 5 --max-requests 120 --max-weighted-calls 800 --daily-weighted-calls 8000
          fi
