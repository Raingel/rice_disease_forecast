name: "One-time union station CSV activation (staging)"

on:
  push:
    branches:
      - ops/one-time-union-station-repair-20261104
    paths:
      - .github/workflows/one_time_union_activate.yml

permissions:
  contents: write

jobs:
  build-one-time-station-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout only required one-time repair inputs
        uses: actions/checkout@v4
        with:
          ref: ops/one-time-union-station-repair-20261104
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/one_time_union_activation.py
            /models/recent_forecast_organizer.py
            /models/EPIRICE_BLB/
            /models/EPIRICE_LB/
            /models/epirice/
            /rice_blast_prediction/recent_daily_by_station/
            /rice_blast_prediction/data/20261121_BlastGRU-TW.csv
            /rice_blast_prediction/data/20261121_BlastLSTLS.csv
            /rice_blast_prediction/data/20261121_BLBTSLS.csv
            /rice_blast_prediction/data/20261121_BlastTF.csv
            /rice_blast_prediction/data/20261121_BlastGAT.csv
            /rice_blast_prediction/data/20261121_BLASTAM.csv
            /rice_blast_prediction/data/20261122_BlastLSTLS.csv
            /rice_blast_prediction/data/20261122_BLBTSLS.csv
            /rice_blast_prediction/data/20261122_BLASTAM.csv
      - name: Reject changed branch revision before staging
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install exact regression dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3
      - name: Check expected scope without modifying files
        run: PYTHONPATH=. python scripts/one_time_union_activation.py
      - name: Apply once on staging branch only
        env:
          ONE_TIME_UNION_APPROVED: 'yes'
        run: PYTHONPATH=. python scripts/one_time_union_activation.py --apply
      - name: Check precisely 800 existing station CSV paths changed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z"], text=True
          ).split("\0")
          changed = [p for p in changed if p]
          allowed = "rice_blast_prediction/recent_daily_by_station/"
          assert len(changed) == 800, f"Expected 800 station files, saw {len(changed)}"
          assert all(p.startswith(allowed) and p.endswith(".csv") for p in changed), changed
          for path in changed:
              assert Path(path).is_file(), f"Missing original station CSV: {path}"
          print(f"Validated {len(changed)} existing station CSV file changes")
          PY
      - name: Commit staged data to one-time branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u rice_blast_prediction/recent_daily_by_station/
          git commit -m "data: restore 1600 model-backed station-days on 2026-11-21/22 (one time)"
          git push origin HEAD:refs/heads/ops/one-time-union-station-repair-20261104
