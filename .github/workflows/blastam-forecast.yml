name: Daily BLASTAM Forecast

on:
  schedule:
    # 01:30 Asia/Taipei = 17:30 UTC (previous day)
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize both forecast writers across workflows (not per-workflow),
# without cancelling a running or previously queued forecast.
concurrency:
  group: rice-forecast-main-writer
  cancel-in-progress: false
  queue: max

jobs:
  run-blastam-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize latest main after the shared writer lock
        run: bash scripts/prepare_forecast_main_checkout.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-github-actions.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-github-actions.txt

      - name: Run BLASTAM pipeline
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
          DATA_FOLDER: ${{ github.workspace }}/rice_blast_prediction/data
          RECENT_OUTPUT_FOLDER: ${{ github.workspace }}/rice_blast_prediction/recent_daily_by_station
          OUTPUT_CSV: ${{ github.workspace }}/rice_blast_prediction/recent_summary.csv
          PLAN_FOLDER: ""
        run: bash scripts/run_blastam_pipeline.sh

      - name: Commit and push updated outputs
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rice_blast_prediction/data rice_blast_prediction/recent_daily_by_station rice_blast_prediction/recent_summary.csv ERA5 ERA5_archive
            git commit -m "chore: BLASTAM forecast update ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"
            # Non-force; if an external writer moved main, fail rather than overwrite.
            git push origin HEAD:refs/heads/main
          else
            echo "No changes to commit."
          fi
