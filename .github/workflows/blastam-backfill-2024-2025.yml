name: One-time: BLASTAM Backfill 2024-2025

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill start date (YYYY-MM-DD)'
        required: true
        default: '2024-01-01'
      end_date:
        description: 'Backfill end date (YYYY-MM-DD)'
        required: true
        default: '2025-12-31'

permissions:
  contents: write

jobs:
  run-blastam-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-github-actions.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-github-actions.txt

      - name: Run BLASTAM backfill (2024-2025)
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
          DATA_FOLDER: ${{ github.workspace }}/rice_blast_prediction/data
          RECENT_OUTPUT_FOLDER: ${{ github.workspace }}/rice_blast_prediction/recent_daily_by_station
          OUTPUT_CSV: ${{ github.workspace }}/rice_blast_prediction/recent_summary.csv
          PLAN_FOLDER: ""
          BLASTAM_BACKFILL_START_DATE: ${{ inputs.start_date }}
          BLASTAM_BACKFILL_END_DATE: ${{ inputs.end_date }}
        run: bash legacy/scripts/run_blastam_backfill_2024_2025.sh

      - name: Commit and push updated outputs
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rice_blast_prediction/data rice_blast_prediction/recent_daily_by_station rice_blast_prediction/recent_summary.csv ERA5 ERA5_archive
            git commit -m "chore: BLASTAM backfill ${{ inputs.start_date }} to ${{ inputs.end_date }}"
            git push
          else
            echo "No changes to commit."
          fi
