name: Migrate EPIRICE daily values and non-crop markers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-epirice-output.yml'
      - 'scripts/migrate_epirice_outputs.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epirice-output-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'data: migrate EPIRICE primary flow and non-crop markers' || github.event.head_commit.message == 'data: repair EPIRICE recent-window migration' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /models/EPIRICE_BLB/
            /models/recent_forecast_organizer.py
            /scripts/migrate_epirice_outputs.py
            /scripts/rebuild_epirice_history.py
            /tests/test_epirice*.py
            /tests/fixtures/epirice_blb/
            /rice_blast_prediction/data/*_EPIRICE_BLB.csv
            /rice_blast_prediction/recent_daily_by_station/
            /rice_blast_prediction/epirice_blb_states/inputs/
            /rice_blast_prediction/epirice_blb_history/*/data/
            /rice_blast_prediction/epirice_blb_history/*/inputs/
            /rice_blast_prediction/epirice_blb_history/*/rebuild_audit.json
            /rice_blast_prediction/epirice_output_migration.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3
      - name: Test output contract and model parity
        run: python -m unittest discover -s tests -p 'test_epirice*.py'
      - name: Restore original station tables for one-time recent-window repair
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'data: repair EPIRICE recent-window migration' }}"
        run: |
          git fetch --depth=1 origin f52b8c2a349ed71d509c50f7d7e3386dc77ba7bd
          git restore --source=f52b8c2a349ed71d509c50f7d7e3386dc77ba7bd --worktree -- rice_blast_prediction/recent_daily_by_station
          echo 'EPIRICE_RECENT_BASELINE=f52b8c2a349ed71d509c50f7d7e3386dc77ba7bd' >> "$GITHUB_ENV"
      - name: Convert and validate all saved EPIRICE outputs
        run: python scripts/migrate_epirice_outputs.py
      - uses: actions/upload-artifact@v4
        with:
          name: epirice-output-migration-report
          path: rice_blast_prediction/epirice_output_migration.json
          retention-days: 90
      - name: Commit converted outputs with concurrent-update protection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ':(glob)rice_blast_prediction/data/*_EPIRICE_BLB.csv' rice_blast_prediction/recent_daily_by_station rice_blast_prediction/epirice_blb_history rice_blast_prediction/epirice_output_migration.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: convert saved EPIRICE outputs to new-infection flow'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              git reset --hard origin/main
              python scripts/migrate_epirice_outputs.py
              git add ':(glob)rice_blast_prediction/data/*_EPIRICE_BLB.csv' rice_blast_prediction/recent_daily_by_station rice_blast_prediction/epirice_blb_history rice_blast_prediction/epirice_output_migration.json
              git commit -m 'data: convert saved EPIRICE outputs to new-infection flow'
            fi
          done
          exit 1
