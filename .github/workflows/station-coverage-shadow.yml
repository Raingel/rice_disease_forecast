name: Shadow full-station forecast coverage regression

on:
  pull_request:
    paths:
      - 'models/recent_forecast_organizer.py'
      - 'tests/test_station_coverage_repair.py'
      - 'tests/fixtures/coverage_shadow/**'
      - '.github/workflows/station-coverage-shadow.yml'
      - 'docs/station_coverage_shadow_20261103.md'

permissions:
  contents: read

jobs:
  full-source-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /models/
            /tests/
            /scripts/
            /registry/
      - name: Checkout immutable published source revision for full CSV regression
        uses: actions/checkout@v4
        with:
          ref: 51fb7be702a28ae2133cbc466d409b47a8e5dee8
          path: .pinned-coverage-evidence
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /rice_blast_prediction/data/20261120_BlastGRU-TW.csv
            /rice_blast_prediction/data/20261120_BlastLSTLS.csv
            /rice_blast_prediction/data/20261120_BLASTAM.csv
            /rice_blast_prediction/data/20261121_BlastGRU-TW.csv
            /rice_blast_prediction/data/20261121_BlastLSTLS.csv
            /rice_blast_prediction/data/20261121_BLBTSLS.csv
            /rice_blast_prediction/data/20261121_BlastTF.csv
            /rice_blast_prediction/data/20261121_BlastGAT.csv
            /rice_blast_prediction/data/20261121_BLASTAM.csv
            /rice_blast_prediction/data/20261122_BlastLSTLS.csv
            /rice_blast_prediction/data/20261122_BLBTSLS.csv
            /rice_blast_prediction/data/20261122_BLASTAM.csv
      - name: Restore verified pinned source bytes inside isolated CI workspace
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          fixture = json.loads(Path("tests/fixtures/coverage_shadow/20261120_22_published.json").read_text(encoding="utf-8"))
          assert fixture["source_revision"] == "51fb7be702a28ae2133cbc466d409b47a8e5dee8"
          touched = set()
          for day in fixture["days"]:
              for item in day["sources"]:
                  path = Path(item["source_path"])
                  pinned = Path(".pinned-coverage-evidence") / path
                  assert pinned.is_file(), f"missing pinned source: {pinned}"
                  actual = subprocess.check_output(["git", "hash-object", str(pinned)], text=True).strip()
                  assert actual == item["source_blob_sha"], f"hash mismatch: {path}"
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(pinned.read_bytes())
                  touched.add(str(path))
          assert len(touched) == 12, len(touched)
          print("Verified 12 full original model CSVs from immutable source revision")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install isolated regression requirements
        run: python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3
      - name: Read all pinned full-size model CSVs and compare 892-station shadow values
        env:
          REQUIRE_FULL_COVERAGE_SHADOW: '1'
          RECENT_STATION_COVERAGE_MODE: legacy
        run: python -m unittest discover -s tests -p 'test_station_coverage_repair.py' -v
      - name: Preserve frozen public v1 outputs
        run: python -m unittest discover -s tests -p 'test_public_contract_v1.py' -v
      - name: Preserve EPIRICE and current-station relocation contracts
        run: |
          python -m unittest discover -s tests -p 'test_epirice_*.py'
          python -m unittest discover -s tests -p 'test_recent_station_coordinates.py'
      - name: Preserve metadata registry compatibility
        run: python -m unittest discover -s tests -p 'test_model_registry.py'
