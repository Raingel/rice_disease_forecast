name: One-time workflow YAML validation

on:
  pull_request:
    paths:
      - '.github/workflows/era5-archive-once.yml'
      - '.github/workflows/blastdt2-backfill.yml'
      - '.github/workflows/one-time-yaml-validation.yml'
      - 'tests/test_one_time_workflow_yaml.py'

permissions:
  contents: read

jobs:
  syntax-and-triggers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install YAML parser only
        run: python -m pip install PyYAML==6.0.2
      - name: Verify syntax and manual-only triggers
        run: python -m unittest discover -s tests -p 'test_one_time_workflow_yaml.py' -v
