name: Daily Rice Disease Forecast

on:
  schedule:
    # 00:00 Asia/Taipei = 16:00 UTC (previous day)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Optional backfill start date (YYYY-MM-DD). Leave empty for normal daily mode.'
        required: false
        default: ''
      end_date:
        description: 'Optional backfill end date (YYYY-MM-DD). Leave empty for normal daily mode.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-forecast-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-github-actions.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-github-actions.txt

      - name: Run daily forecast pipeline
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
          DATA_FOLDER: ${{ github.workspace }}/rice_blast_prediction/data
          RECENT_OUTPUT_FOLDER: ${{ github.workspace }}/rice_blast_prediction/recent_daily_by_station
          OUTPUT_CSV: ${{ github.workspace }}/rice_blast_prediction/recent_summary.csv
          PLAN_FOLDER: ""
          ERA5_OUTPUT_DIR: ${{ github.workspace }}/ERA5
          BACKFILL_START_DATE: ${{ inputs.start_date || '' }}
          BACKFILL_END_DATE: ${{ inputs.end_date || '' }}
          BLASTDT2_BACKFILL_START_DATE: ${{ inputs.start_date || '' }}
          BLASTDT2_BACKFILL_END_DATE: ${{ inputs.end_date || '' }}
        run: bash scripts/run_daily_pipeline.sh

      - name: Commit and push updated outputs
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rice_blast_prediction/data rice_blast_prediction/recent_daily_by_station rice_blast_prediction/recent_summary.csv ERA5
            git commit -m "chore: daily forecast update ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"
            git push
          else
            echo "No changes to commit."
          fi
