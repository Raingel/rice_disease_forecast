name: Phase 4B Registry pipeline shadow compatibility

on:
  pull_request:
    paths:
      - 'models/recent_forecast_organizer.py'
      - 'models/crop_season_avg.py'
      - 'models/registry_legacy_bridge.py'
      - 'tests/test_phase4b_registry_shadow.py'
      - 'registry/models.json'
      - 'docs/phase4b_registry_pipeline_shadow.md'
      - '.github/workflows/phase4b-registry-shadow.yml'

permissions:
  contents: read

jobs:
  catalog-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            models
            tests
            registry
            scripts
            .github/workflows
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install isolated test dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3
      - name: Opt-in registry catalog vs public legacy byte parity
        run: python -m unittest discover -s tests -p 'test_phase4b_registry_shadow.py' -v
      - name: Preserve registry metadata
        run: python -m unittest discover -s tests -p 'test_model_registry.py' -v
      - name: Preserve published CSV v1 contract
        run: python -m unittest discover -s tests -p 'test_public_contract_v1.py' -v
      - name: Preserve EPIRICE and station-day regression
        run: |
          python -m unittest discover -s tests -p 'test_epirice_*.py'
          python -m unittest discover -s tests -p 'test_recent_station_coordinates.py'
      - name: Preserve opt-in union coverage regression
        run: python -m unittest discover -s tests -p 'test_station_coverage_repair.py'
